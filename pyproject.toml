[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-platform"
version = "0.2.0"
description = "GenAI platform lab: production-ready LLM client (llm_client) and eval harness (llm_evals)."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.113", "httpx"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["llm_client", "llm_evals"]
